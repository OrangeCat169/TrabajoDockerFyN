name: Deploy to Azure VM

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Desplegar mediante SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            rm -rf ~/todo-app
            mkdir -p ~/todo-app
            cd ~/todo-app
            git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .
            export GITHUB_SHA=$(git rev-parse --short HEAD)
            docker compose down
            docker compose up -d --build

      - name: Verificar que la web responde correctamente
        run: |
          for i in {1..5}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.AZURE_VM_HOST }}/)
            if [ "$response" -eq 200 ]; then
              echo "La web responde correctamente con código HTTP 200."
              exit 0
            fi
            echo "Intento $i: Esperando a que la aplicación responda..."
            sleep 5
          done
          echo "Error crítico: La web no responde y el workflow ha fallado."
          exit 1