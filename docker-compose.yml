version: '3.8'

services:
  app:
    build: ./app
    ports:
      - "80:80"
    environment:
      DB_HOST: bd
      DB_NAME: nube
      DB_USER: root
      DB_PASSWORD: clase123
      APP_VERSION: ${GITHUB_SHA:-1.0.0}
    depends_on:
      bd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3

  bd:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: clase123
      MYSQL_DATABASE: nube
    volumes:
      - datos_mariadb:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/migration.sql:/docker-entrypoint-initdb.d/02-migration.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.pl", "--connect", "--username=root", "--password=clase123"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  datos_mariadb: